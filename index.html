
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>انتهاء التسجيلات</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #f8f5ff, #fceef6, #eef2ff);
            overflow-x: hidden;
        }

        /* Background */
        .circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
            animation: float 7s ease-in-out infinite;
        }

        .circle.one {
            width: 280px;
            height: 280px;
            background: #e5d5ff;
            top: -100px;
            right: -80px;
        }

        .circle.two {
            width: 240px;
            height: 240px;
            background: #ffcce5;
            bottom: -80px;
            left: -70px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        /* Full Screen Center */
        .page-wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: ltr;
            z-index: 1;
        }

        /* Main Card */
        .container {
            direction: rtl;
            text-align: center;

            width: 100%;
            max-width: 500px;

            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;

            padding: 45px 25px;

            box-shadow: 0 20px 70px rgba(80, 40, 120, 0.10);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Icon */
        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;

            background: linear-gradient(135deg, #7139a5, #bd54a7);
            border-radius: 27px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 12px 30px rgba(130, 65, 170, 0.25);
            transform: rotate(-5deg);
        }

        .icon svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Text */
        .tag {
            display: inline-block;
            background: #f3eaff;
            color: #7945a5;
            padding: 7px 18px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(25px, 7vw, 37px);
            font-weight: 900;
            color: #30213f;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        h1 span {
            color: #9952b7;
        }

        .description {
            color: #777080;
            font-size: 15px;
            line-height: 2;
            font-weight: 500;
            max-width: 420px;
            margin: 0 auto;
        }

        .divider {
            width: 55px;
            height: 4px;
            border-radius: 10px;
            background: linear-gradient(90deg, #7139a5, #e77db8);
            margin: 25px auto;
        }

        .thank-you {
            font-size: 14px;
            color: #554462;
            font-weight: 700;
            line-height: 2;
        }

        .footer {
            margin-top: 25px;
            color: #aaa1b1;
            font-size: 10px;
            font-weight: 600;
            direction: ltr;
            letter-spacing: 1px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .page-wrapper {
                padding: 18px;
            }

            .container {
                max-width: 100%;
                padding: 35px 20px;
                border-radius: 24px;
            }

            .icon {
                width: 78px;
                height: 78px;
                border-radius: 23px;
                margin-bottom: 22px;
            }

            .icon svg {
                width: 42px;
                height: 42px;
            }

            .description {
                font-size: 14px;
            }

            .thank-you {
                font-size: 13px;
            }
        }

        /* Very Small Screens */
        @media (max-width: 350px) {
            .page-wrapper {
                padding: 12px;
            }

            .container {
                padding: 28px 14px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>

    <main class="page-wrapper">

        <section class="container">

            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12.5l4.5 4.5L19 7"/>
                </svg>
            </div>

            <div class="tag">
                REGISTRATION CLOSED
            </div>

            <h1>
                تم انتهاء <span>التسجيلات</span>
            </h1>

            <p class="description">
                باب التسجيلات اتقفل، وبنشكر كل شخص اهتم وشارك
                وقدم في الفرصة دي.
            </p>

            <div class="divider"></div>

            <p class="thank-you">
                شكراً لتعاونكم وثقتكم ❤️
                <br>
                في انتظاركم في الفرصة الجاية!
            </p>

            <div class="footer">
                SEE YOU IN THE NEXT OPPORTUNITY
            </div>

        </section>

    </main>

</body>
</html>
